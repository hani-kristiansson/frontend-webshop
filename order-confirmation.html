<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You for Your Order</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="thank-you-container">
        <h1>Thank you for your order!</h1>
        <p>Your order number is: <strong id="order-number"></strong></p>
        
        <h2>Products you have purchased</h2>
        <div id="order-items" class="product-list"></div>

        <a href="index.html" class="home-button">Tillbaka till startsidan</a>
    </div>

    <script>
        // Simulated order details (In real implementation, get this from backend)
        const orderNumber = Math.floor(100000 + Math.random() * 900000); // Random order number
        document.getElementById('order-number').textContent = orderNumber;

        const purchasedItems = [
            { name: "Produkt 1", price: "299 SEK", image: "img/product1.jpg" },
            { name: "Produkt 2", price: "499 SEK", image: "img/product2.jpg" }
        ];

        const orderItemsContainer = document.getElementById('order-items');
        purchasedItems.forEach(item => {
            const productDiv = document.createElement('div');
            productDiv.classList.add('product-item');
            productDiv.innerHTML = `
                <img src="${item.image}" alt="${item.name}">
                <p>${item.name} - <strong>${item.price}</strong></p>
            `;
            orderItemsContainer.appendChild(productDiv);
        });
    </script>
</body>
</html>
