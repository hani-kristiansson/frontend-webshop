<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/checkout.css" />
  </head>

  <body>
    <header>
      <div class="top-header-bar">
        <p>Free delivery over 1000 SEK</p>
      </div>
      <div class="header-main">
        <div class="logo" id="checkout-logo">
          <a href="index.html"><img src="img/By_Hani_Logo.png" alt="By Hani Logo" /></a>
        </div>
      </div>
    </header>

    <div class="container mt-10">
      <div class="row">
        <!-- Product img and details -->
        <div id="checkout-container" class="col-md-6">
        </div>

        <!-- Checkout form -->
        <div class="col-md-6">
          <div>
            <div>
              <button onclick="clearShoppingCart()">Clear cart</button>
              <br><br>
            </div>
            <div>
              <h2>Your Cart</h2>
              <div class="cart-summary">
              
              <!-- Cart Items Go Here -->
              </div>
            </div>
          </div>
          
          <div class="checkout-form">
            <h2>Shipping address</h2>
            
            <form
            class="container m-20"
            onsubmit="return validateForm()"
            action="javascript: orderConfirmation()"
            >
              <label for="name">Name:</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Firstname Familyname"
              />
              <div id="nameError" class="error-label"></div>
              <br>
          
              <label for="email">Email:</label>
              <input
                type="text"
                id="email"
                name="email"
                placeholder="exempel@mail.com"
              />
              <div id="emailError" class="error-label"></div>
              <br>

              <label for="phone">Phone Number:</label>
              <input
                type="text"
                id="phone"
                name="phone"
                placeholder="070-123 45 67"
              />
              <div id="mobileError" class="error-label"></div>
              <br>
          
              <label for="street">Street Address:</label>
              <input
                type="text"
                id="street"
                name="street"
                placeholder="Storgatan 12"
              />
              <div id="addressError" class="error-label"></div>
              <br>

              <label for="zipcode">Zip Code:</label>
              <input
                type="text"
                id="zipcode"
                name="zipcode"
                placeholder="12345"
                maxlength="5"
              />
              <div id="areaCodeError" class="error-label"></div>
              <br>

              <label for="district">District:</label>
              <input
                type="text"
                id="district"
                name="district"
                placeholder="Stockholm"
              />
              <div id="districtError" class="error-label"></div>
              <br>

              <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary mt-3" >Pay Now</button>
              </div>
            
            </form>
          </div>
        </div>
      </div>
    </div>

    <hr />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/order-form.js"></script>

  </body>
</html>
