<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/checkout.css" />
  </head>

  <body>
    <header>
      <div class="top-header-bar">
        <p>Free delivery over 1000 SEK</p>
      </div>
      <div class="header-main">
        <div class="logo" id="checkout-logo">
          <a href="index.html"><img src="img/By_Hani_Logo.png" alt="By Hani Logo" /></a>
        </div>
      </div>
    </header>

    <div class="container mt-10">
      <div class="row">
        <!-- Product img and details -->
        <div id="checkout-container" class="col-md-6">
        </div>
        

        <!-- Checkout form -->
        <div class="col-md-6">
          <div class="cart-summary">
            <h2>Your Cart</h2>
            <!-- Cart Items Go Here -->
          </div>
          <div class="checkout-form">
            <h2>Checkout</h2>
            <form action="submit_checkout.php" method="post">
              <label for="name">Name:</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Firstname Familyname"
                required
                minlength="2"
                maxlength="50"
              />
              <br>
              <br>

              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="exempel@mail.com"
                maxlength="50"
              />
              <br>
              <br>

              <label for="phone">Phone Number:</label>
              <input
                type="text"
                id="phone"
                name="phone"
                placeholder="070-123 45 67"
                pattern="[\d\-\(\) ]+"
                maxlength="50"
              />
              <br>
              <br>
              <br>

              <h3>Delivery Address</h3>
              <label for="street">Street Address:</label>
              <input
                type="text"
                id="street"
                name="street"
                placeholder="Storgatan 12"
                minlength="2"
                maxlength="50"
              />
              <br>
              <br>

              <label for="zipcode">Zip Code:</label>
              <input
                type="text"
                id="zipcode"
                name="zipcode"
                placeholder="12345"
                required
                pattern="^\d{5}$"
                maxlength="5"
              />
              <br>
              <br>

              <label for="district">District:</label>
              <input
                type="text"
                id="district"
                name="district"
                placeholder="Stockholm"
                minlength="2"
                maxlength="50"
              />
              <br>
              <br>

              <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary mt-3" action="/order-confirmation.hmtl">Pay Now</button>
              </div>
            
            </form>
          </div>
        </div>
      </div>
    </div>

    <hr />

    <div class="checkout-container">

      <div class="info-section">
        <h3>Always with us</h3>
        <ul>
          <li>30-day return policy</li>
          <li>Price guarantee</li>
        </ul>
      </div>
      <div class="customer-service">
        <h3>Need Help?</h3>
        <p>Customer Service: 07-999 11 22</p>
        <p>help@hani.se</p>
        <p>Mon - Fri: 9:00 AM - 3:00 PM</p>
      </div>
    </div>
    <hr />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="order-form.js"></script>

  </body>
</html>
